[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-as-code-lab"
version = "1.0.0"
description = "Detection-as-Code & Purple Team SOC Lab with Sigma rules, log normalization, correlation, IOC enrichment, and NIST SP 800-61 reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Henrique Vidal" }]
keywords = [
    "cybersecurity",
    "detection-as-code",
    "sigma",
    "blue-team",
    "soc",
    "mitre-attack",
    "nist-800-61",
    "purple-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.1"]
dev = [
    "PyYAML>=6.0.1",
    "bandit>=1.7.9",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
dac-lab = "detection_engine.cli:main"

[tool.setuptools.packages.find]
include = ["detection_engine*", "simulator*"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
