title: Suspicious Linux Credential File Access (/etc/shadow or SSH Private Keys)
id: 1a2b3c4d-3002-4c02-9d02-000000000007
status: stable
description: Detects command-line attempts to read or copy /etc/shadow or root/user SSH private keys, commonly observed during post-exploitation credential harvesting.
author: Pedro Henrique Vidal (PH-Vidal)
date: 2026-11-20
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://attack.mitre.org/techniques/T1552/004/
tags:
  - attack.credential_access
  - attack.t1003.008
  - attack.t1552.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    process.name:
      - cat
      - grep
      - cp
      - tar
      - base64
      - scp
  selection_target:
    process.command_line|contains:
      - "/etc/shadow"
      - "/root/.ssh/id_rsa"
      - "/root/.ssh/id_ed25519"
      - "/.ssh/id_rsa"
  filter_legit_backup:
    user.name: backup_agent
  condition: selection_tool and selection_target and not filter_legit_backup
falsepositives:
  - Authorized configuration management or backup agents running under dedicated service accounts
level: high
playbook_id: PB-005
